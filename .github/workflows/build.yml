name: Build Windows EXE

on:
  # 推送到 main 分支时触发
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'core/**'
      - 'ui/**'
      - 'requirements.txt'
      - 'tvbox.spec'
  # 打 tag 时触发 (如 v1.0.0)
  tags:
    - 'v*'
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 4. 下载 mpv
      - name: Download mpv
        run: |
          # 下载 mpv Windows 构建
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/latest/download/mpv-x86_64-20240915-git-7c89606.7z"
          # 尝试从 sourceforge 下载
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-x86_64-v3-20240915-git-7c89606.7z/download" -OutFile "mpv.7z" -UseBasicParsing
          # 解压
          7z x mpv.7z -ompv_extract -y
          # 复制 dll
          Copy-Item "mpv_extract\mpv-2.dll" -Destination "." -ErrorAction SilentlyContinue
          if (-not (Test-Path "mpv-2.dll")) {
            Write-Host "⚠️ mpv-2.dll 下载失败，将不包含播放器 DLL"
          }
        shell: pwsh
        continue-on-error: true

      # 5. PyInstaller 打包
      - name: Build EXE
        run: |
          pyinstaller tvbox.spec --clean --noconfirm
        shell: cmd

      # 6. 复制 mpv DLL
      - name: Copy mpv DLL
        run: |
          if (Test-Path "mpv-2.dll") {
            Copy-Item "mpv-2.dll" -Destination "dist\TVBox Desktop\mpv-2.dll"
            Write-Host "✅ mpv-2.dll 已复制"
          } else {
            Write-Host "⚠️ 跳过 mpv-2.dll"
          }
        shell: pwsh
        continue-on-error: true

      # 7. 打包为 zip
      - name: Create ZIP
        run: |
          Compress-Archive -Path "dist\TVBox Desktop\*" -DestinationPath "TVBox-Desktop-win64.zip" -Force
          Write-Host "📦 $(Get-Item 'TVBox-Desktop-win64.zip' | Select-Object -ExpandProperty Length) bytes"
        shell: pwsh

      # 8. 上传构建产物 (每次 push 都可以下载)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Desktop-win64
          path: TVBox-Desktop-win64.zip
          retention-days: 30

  # 打 tag 时自动创建 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TVBox-Desktop-win64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: TVBox-Desktop-win64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
