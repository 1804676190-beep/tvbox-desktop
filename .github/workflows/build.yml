name: Build Windows Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download mpv
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-x86_64-v3-20240915-git-7c89606.7z/download" -OutFile "mpv.7z" -UseBasicParsing
          7z x mpv.7z -ompv_extract -y
          Copy-Item "mpv_extract\mpv-2.dll" -Destination "." -ErrorAction SilentlyContinue
        shell: pwsh
        continue-on-error: true

      - name: Build EXE
        run: pyinstaller tvbox.spec --clean --noconfirm
        shell: cmd

      - name: Copy mpv DLL
        run: |
          if (Test-Path "mpv-2.dll") {
            Copy-Item "mpv-2.dll" -Destination "dist\TVBox Desktop\mpv-2.dll"
          }
        shell: pwsh
        continue-on-error: true

      - name: Build Installer (Inno Setup)
        uses: jrmypfrd/setup-innosetup@v1
        with:
          version: '6.2.2'

      - name: Compile Installer
        run: iscc installer.iss /Q
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Desktop-Setup
          path: installer_output/TVBox-Desktop-*-Setup.exe
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TVBox-Desktop-Setup

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: TVBox-Desktop-*-Setup.exe
          generate_release_notes: true
